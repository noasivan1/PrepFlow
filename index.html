<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <!-- Installable on a phone / tablet home screen ("Add to Home Screen" on iOS, "Install app" on Android). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="PrepFlow" />
    <title>PrepFlow</title>
    <script>
      // Runs before React loads so the page does not flash light theme / wrong
      // direction for a split second. Reads the same keys SettingsProvider saves.
      (function () {
        try {
          var theme = localStorage.getItem('prepflow-theme')
          if (theme !== 'dark' && theme !== 'light') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
          }
          if (theme === 'dark') document.documentElement.classList.add('dark')

          var language = localStorage.getItem('prepflow-language')
          if (language !== 'he' && language !== 'en') {
            language = navigator.language.indexOf('he') === 0 ? 'he' : 'en'
          }
          document.documentElement.lang = language
          document.documentElement.dir = language === 'he' ? 'rtl' : 'ltr'
        } catch (error) {
          /* localStorage can be blocked; the app still works with defaults. */
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Heebo:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
